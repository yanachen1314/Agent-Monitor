name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./AgentMonitorElectron/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json 中的版本号不符合 SemVer：$version"
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag 已存在。请先更新 package.json 版本号再合并到 master。"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AgentMonitorElectron
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentMonitorElectron/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-windows:
    name: Build Windows installer
    needs:
      - prepare
      - quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AgentMonitorElectron
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentMonitorElectron/package-lock.json
      - name: Install MinGW GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - run: npm ci
      - name: Verify MinGW GCC
        shell: pwsh
        env:
          AGENT_MONITOR_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:AGENT_MONITOR_GCC)) {
            throw "MinGW GCC not found: $env:AGENT_MONITOR_GCC"
          }
          & $env:AGENT_MONITOR_GCC --version
      - name: Build Windows installer
        run: npm run build:win
        env:
          AGENT_MONITOR_GCC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
      - name: Archive unpacked Windows app
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $releaseDirectory = Join-Path (Get-Location) "release\$env:RELEASE_VERSION"
          $unpackedDirectory = Join-Path $releaseDirectory 'win-unpacked'
          $archivePath = Join-Path $releaseDirectory "Agent.Monitor-$env:RELEASE_VERSION-Windows-x64-unpacked.zip"

          if (-not (Test-Path -LiteralPath $unpackedDirectory -PathType Container)) {
            throw "Windows unpacked directory not found: $unpackedDirectory"
          }

          Compress-Archive -LiteralPath $unpackedDirectory -DestinationPath $archivePath -CompressionLevel Optimal -Force
      - name: Upload Windows release files
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            AgentMonitorElectron/release/${{ needs.prepare.outputs.version }}/*.exe
            AgentMonitorElectron/release/${{ needs.prepare.outputs.version }}/*.blockmap
            AgentMonitorElectron/release/${{ needs.prepare.outputs.version }}/*.zip
            AgentMonitorElectron/release/${{ needs.prepare.outputs.version }}/latest.yml
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS installers
    # macOS release builds are enabled by default; set ENABLE_MACOS_RELEASE=false to opt out.
    if: vars.ENABLE_MACOS_RELEASE != 'false'
    needs:
      - prepare
      - quality
    runs-on: macos-latest
    defaults:
      run:
        working-directory: AgentMonitorElectron
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentMonitorElectron/package-lock.json
      - run: npm ci
      - name: Build macOS installers
        run: npm run build:mac:release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS release files
        uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: AgentMonitorElectron/release/${{ needs.prepare.outputs.version }}/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create tag and GitHub Release
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          needs.build-windows.result == 'success' &&
          (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "Agent Monitor $RELEASE_VERSION"
          --generate-notes
